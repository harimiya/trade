name: Market Index Breakout Notifier

on:
  schedule:
    # UTC 18:00 は 日本時間(JST) 03:00 に対応
    - cron: '0 18 * * *'
  # 手動実行ボタン(workflow_dispatch)も有効化
  workflow_dispatch:

jobs:
  check-breakout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-policy: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Breakout Check Script
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python main.py
