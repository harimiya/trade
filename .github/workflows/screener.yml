name: Daily Stock Screener

on:
  schedule:
    # 毎週月〜金曜日の JST 01:00（UTC 16:00）に自動実行
    - cron: '0 16 * * 1-5'
  workflow_dispatch: # Actions画面からの手動実行ボタンを有効化

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas<3.0.0" "numpy<2.0.0" yfinance requests scipy openpyxl beautifulsoup4 lxml matplotlib mplfinance

      - name: Run Screener Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python screener.py
