name: Daily Stock Screener

on:
  schedule:
    # JST 01:00 = UTC 16:00 (前日)
    - cron: '0 16 * * *'
  workflow_dispatch: # 手動実行用ボタンを追加

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests pandas-ta scipy openpyxl beautifulsoup4 lxml matplotlib mplfinance          playwright install chromium
          playwright install-deps

      - name: Run Screener Script
        timeout-minutes: 90 # タイムアウト時間を指定
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python screener.py
